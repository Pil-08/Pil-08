[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-batch-monitor"
version = "12.1.0"
description = "Desktop queue for Claude: write questions, auto-resume after limits, hard spend cap. GUI and CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samuel Pil" }]
keywords = ["claude", "anthropic", "batch", "queue", "rate-limit", "tkinter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["anthropic>=0.69"]

[project.optional-dependencies]
# API key in the OS keyring instead of an environment variable
secure = ["keyring>=24"]
# Minimise to the system tray
tray = ["pystray>=0.19", "Pillow>=10"]
# Desktop notifications
notify = ["plyer>=2.1"]
all = ["keyring>=24", "pystray>=0.19", "Pillow>=10", "plyer>=2.1"]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6", "Pillow>=10"]

[project.scripts]
claude-batch-monitor = "claude_batch_monitor.__main__:main"

[project.gui-scripts]
claude-batch-monitor-gui = "claude_batch_monitor.__main__:main"

[tool.setuptools]
packages = [
    "claude_batch_monitor",
    "claude_batch_monitor.core",
    "claude_batch_monitor.gui",
]

[tool.setuptools.package-data]
"claude_batch_monitor.gui" = ["icono.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gui: needs tkinter and a display (use xvfb-run on Linux servers)",
    "keepawake_real: exercises the real KeepAwake class (every other test stubs it out)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["claude_batch_monitor.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long UI strings are fine
    "B008",
    "UP007", # keep Optional[...] readable on 3.9
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
