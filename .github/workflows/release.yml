name: release

# Builds the desktop app for Windows, macOS and Linux.
# Push a tag such as v12.2.0 (or run the workflow by hand) and the three builds appear as artifacts;
# for a tag, they are also attached to a DRAFT release that you review and publish yourself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos
          # Ubuntu 22.04 on purpose: a binary built against an older glibc runs on newer systems, not the reverse.
          - os: ubuntu-22.04
            nombre: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk
      - name: Install
        run: python -m pip install -e ".[all]" pyinstaller pytest
      # The suite runs on Linux (see ci.yml). Some tests compare POSIX paths, so on Windows and macOS the job
      # only builds and smoke-tests: a quirk of the test suite must not block a release build.
      - name: Tests without windows (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -m "not gui"
      - name: Build (Linux, under a virtual display so the tray backends can be found)
        if: runner.os == 'Linux'
        run: xvfb-run -a pyinstaller packaging/claude-batch-monitor.spec --noconfirm
      - name: Build
        if: runner.os != 'Linux'
        run: pyinstaller packaging/claude-batch-monitor.spec --noconfirm
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/ClaudeBatchMonitor --version
          dist/ClaudeBatchMonitor --cli --mensaje "hola" --dry-run
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: dist/ClaudeBatchMonitor.app/Contents/MacOS/ClaudeBatchMonitor --version
      - name: Package
        shell: bash
        run: |
          mkdir -p salida
          case "${{ matrix.nombre }}" in
            windows) cp dist/ClaudeBatchMonitor.exe salida/ClaudeBatchMonitor-windows.exe ;;
            macos)   ditto -c -k --sequesterRsrc --keepParent dist/ClaudeBatchMonitor.app salida/ClaudeBatchMonitor-macos.zip ;;
            linux)   cp dist/ClaudeBatchMonitor salida/ClaudeBatchMonitor-linux && chmod +x salida/ClaudeBatchMonitor-linux ;;
          esac
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeBatchMonitor-${{ matrix.nombre }}
          path: salida/*
          if-no-files-found: error

  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la salida
          gh release create "$GITHUB_REF_NAME" salida/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Claude Batch Monitor ${GITHUB_REF_NAME#v}"
