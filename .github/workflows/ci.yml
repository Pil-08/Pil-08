name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (Tk and a virtual display for the window tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk
      - name: Install
        run: python -m pip install -e ".[all]" pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: xvfb-run -a python -m pytest
