name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (Tk and a virtual display for the window tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb python3-tk
      - name: Install
        run: python -m pip install -e ".[all]" pytest hypothesis ruff
      - name: Lint
        run: ruff check .
      - name: Lint the single file (syntax, undefined names, redefinitions)
        run: ruff check --select F,E9 --no-cache claude_batch_monitor.py
      - name: The single file is up to date with the modules
        run: python tools/build_single_file.py --check
      - name: Tests (the modules)
        run: xvfb-run -a python -m pytest
      - name: Tests (the same suite, against the single file)
        run: CBM_ARCHIVO_UNICO=1 xvfb-run -a python -m pytest
